<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スクショ解析 Phase 1</title>
<style>
  :root {
    --bg: #0d1117; --card: #161b22; --border: #30363d;
    --accent: #58a6ff; --accent2: #f78166; --green: #3fb950;
    --yellow: #d29922; --text: #e6edf3; --muted: #8b949e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 15px; padding: 12px; min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 700; color: var(--accent); text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
  .card-title { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px; }

  .upload-area {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 2px dashed var(--border); border-radius: 8px; padding: 28px 16px; cursor: pointer;
  }
  .upload-area:active { border-color: var(--accent); }
  .upload-area input { display: none; }
  .upload-icon { font-size: 36px; }
  .upload-hint { font-size: 13px; color: var(--muted); text-align: center; line-height: 1.5; }

  /* Canvas: renders at original resolution, CSS scales to fit */
  #canvas-wrap { overflow: hidden; border-radius: 6px; background: #000; }
  canvas { display: block; width: 100%; height: auto; }

  .prog-wrap { background: var(--bg); border-radius: 99px; height: 6px; overflow: hidden; margin-bottom: 8px; }
  .prog-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--green)); border-radius: 99px; transition: width .3s; width: 0; }
  .prog-text { font-size: 12px; color: var(--muted); text-align: center; }

  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .result-row:last-child { border-bottom: none; }
  .r-idx { color: var(--muted); min-width: 24px; font-size: 12px; }
  .r-val { font-weight: 700; font-size: 17px; color: var(--yellow); flex: 1; text-align: center; }
  .r-conf { font-size: 11px; min-width: 60px; text-align: right; }
  .conf-hi  { color: var(--green); }
  .conf-mid { color: var(--accent); }
  .conf-lo  { color: var(--accent2); }

  .legend { display: flex; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .legend-dot { width: 12px; height: 12px; border-radius: 2px; }

  .note { font-size: 12px; color: var(--muted); line-height: 1.8; }
  .note b { color: var(--text); }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 16px 0; }
  .warn { background: #2d1f00; border: 1px solid var(--yellow); border-radius: 6px;
          padding: 10px; font-size: 12px; color: var(--yellow); margin-top: 8px; line-height: 1.6; }
</style>
</head>
<body>

<h1>📸 スクショ解析</h1>
<p class="sub">Phase 1 — バッグ画面 数字OCR 検証</p>

<div class="card">
  <div class="card-title">スクショを選択</div>
  <label class="upload-area">
    <span class="upload-icon">🖼️</span>
    <span class="upload-hint">タップしてバッグ画面の<br>スクショを選択</span>
    <input type="file" id="file-input" accept="image/*">
  </label>
</div>

<div class="card" id="prog-card" hidden>
  <div class="card-title">解析中</div>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  <p class="prog-text" id="prog-text">準備中...</p>
</div>

<div class="card" id="preview-card" hidden>
  <div class="card-title">プレビュー（枠 = 検出した数字）</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>信頼度 高</div>
    <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>信頼度 中</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f78166"></div>信頼度 低</div>
  </div>
  <div id="canvas-wrap"><canvas id="canvas"></canvas></div>
</div>

<div class="card" id="result-card" hidden>
  <div class="card-title">検出された数値 — <span id="count">0</span> 件</div>
  <div id="result-body"></div>
</div>

<div class="card">
  <div class="card-title">このツールについて</div>
  <p class="note">
    <b>Phase 1 目的：</b> OCRで数字を正しく読めるか確認<br>
    <b>Phase 2 予定：</b> アイコン識別でどのアイテムか特定<br>
    <b>Phase 3 予定：</b> 計算ツールへ自動入力<br><br>
    <b>初回起動時：</b>言語モデル（約4MB）をダウンロードします。<br>
    2回目以降はキャッシュされ即起動します。
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const fileInput  = document.getElementById('file-input');
const progCard   = document.getElementById('prog-card');
const previewCard = document.getElementById('preview-card');
const resultCard = document.getElementById('result-card');
const canvas     = document.getElementById('canvas');
const ctx        = canvas.getContext('2d');
const progBar    = document.getElementById('prog-bar');
const progText   = document.getElementById('prog-text');
const resultBody = document.getElementById('result-body');
const countEl    = document.getElementById('count');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => { run(img); URL.revokeObjectURL(url); };
  img.onerror = () => alert('画像の読み込みに失敗しました');
  img.src = url;
});

async function run(img) {
  // Draw original-resolution image on canvas (CSS width:100% scales it visually)
  canvas.width  = img.width;
  canvas.height = img.height;
  ctx.drawImage(img, 0, 0);

  progCard.hidden   = false;
  previewCard.hidden = true;
  resultCard.hidden = true;

  try {
    // Resize for OCR (max 1080px wide = good balance of speed vs accuracy)
    const ocrCanvas = resize(img, 1080);
    const ocrScale  = ocrCanvas.width / img.width; // ratio: OCR coord → original coord

    const worker = await Tesseract.createWorker('eng', 1, {
      logger: m => onLog(m),
    });

    await worker.setParameters({
      tessedit_char_whitelist: '0123456789,',
      tessedit_pageseg_mode: '11', // SPARSE_TEXT: find scattered text anywhere
    });

    setP(55, '画像を解析中...');
    const { data } = await worker.recognize(ocrCanvas);
    await worker.terminate();
    setP(100, '完了');

    // Parse and filter
    const words = (data.words || [])
      .map(w => {
        const raw = w.text.trim();
        const val = parseInt(raw.replace(/,/g, ''), 10);
        return {
          raw, val,
          conf: Math.round(w.confidence),
          // Convert OCR coords → original image coords
          x: Math.round(w.bbox.x0 / ocrScale),
          y: Math.round(w.bbox.y0 / ocrScale),
          bw: Math.round((w.bbox.x1 - w.bbox.x0) / ocrScale),
          bh: Math.round((w.bbox.y1 - w.bbox.y0) / ocrScale),
        };
      })
      .filter(w =>
        /^\d[\d,]*$/.test(w.raw) &&
        !isNaN(w.val) &&
        w.val >= 1 &&
        w.conf >= 30
      )
      // Sort top→bottom, left→right (= bag grid reading order)
      .sort((a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x);

    // Draw bounding boxes on original-res canvas
    const lw = Math.max(3, Math.round(img.width / 250));
    words.forEach(n => {
      ctx.strokeStyle = n.conf >= 70 ? '#3fb950' : n.conf >= 50 ? '#58a6ff' : '#f78166';
      ctx.lineWidth = lw;
      ctx.strokeRect(n.x, n.y, n.bw, n.bh);
    });

    // Result list
    countEl.textContent = words.length;
    if (words.length === 0) {
      resultBody.innerHTML = '<p class="empty">数字が検出されませんでした。<br>別のスクショで試してください。</p>';
    } else {
      resultBody.innerHTML = words.map((n, i) => {
        const cls = n.conf >= 70 ? 'conf-hi' : n.conf >= 50 ? 'conf-mid' : 'conf-lo';
        return `<div class="result-row">
          <span class="r-idx">${i + 1}</span>
          <span class="r-val">${n.val.toLocaleString()}</span>
          <span class="r-conf ${cls}">信頼度 ${n.conf}%</span>
        </div>`;
      }).join('');
    }

    progCard.hidden   = true;
    previewCard.hidden = false;
    resultCard.hidden = false;

  } catch (err) {
    setP(0, `エラー: ${err.message}`);
    console.error(err);
  }
}

function onLog(m) {
  if      (m.status === 'loading tesseract core')        setP(10, 'コアを読み込み中...');
  else if (m.status === 'loading language traineddata')  setP(30, '言語モデルをDL中（初回のみ）...');
  else if (m.status === 'initializing api')              setP(50, '初期化中...');
  else if (m.status === 'recognizing text')
    setP(55 + Math.round(m.progress * 40), `解析中 ${Math.round(m.progress * 100)}%`);
}

function setP(pct, text) {
  progBar.style.width = pct + '%';
  progText.textContent = text;
}

function resize(img, maxW) {
  const scale = Math.min(1, maxW / img.width);
  const c = document.createElement('canvas');
  c.width  = Math.round(img.width  * scale);
  c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c;
}
</script>
</body>
</html>
