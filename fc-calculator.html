<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火晶計算ツール - ホワイトアウトサバイバル</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #242736;
    --border: #2e3248;
    --accent: #e8832a;
    --accent2: #c45e10;
    --blue: #4a9eff;
    --green: #3dd68c;
    --red: #ff5555;
    --yellow: #f0c040;
    --text: #e2e4ef;
    --text2: #9098b8;
    --text3: #5a6080;
    --rfc-color: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; min-height: 100vh; }

  header { background: linear-gradient(135deg, #1a0a00, #2a1200); border-bottom: 1px solid var(--accent2); padding: 14px 16px; }
  header h1 { font-size: 18px; color: var(--accent); font-weight: 700; }
  header p { color: var(--text2); font-size: 12px; margin-top: 2px; }

  .tabs { display: flex; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .page { display: none; padding: 12px; }
  .page.active { display: block; }

  .section { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
  .section-header { padding: 10px 14px; font-weight: 600; font-size: 13px; color: var(--accent); background: rgba(232,131,42,.07); display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
  .section-header .toggle { margin-left: auto; color: var(--text3); transition: transform .2s; }
  .section-header.collapsed .toggle { transform: rotate(-90deg); }
  .section-body { padding: 10px 14px; }

  .production-row { display: flex; gap: 10px; }
  .production-field { flex: 1; }
  .production-field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .production-field input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 14px; }
  .production-field input:focus { outline: none; border-color: var(--accent); }

  .building-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .building-header { display: flex; align-items: center; padding: 10px 12px; gap: 10px; background: var(--bg3); }
  .building-icon { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .building-name { font-weight: 600; font-size: 13px; }
  .building-sub { font-size: 11px; color: var(--text2); }
  .building-toggle { margin-left: auto; }
  .building-toggle input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  .building-body { padding: 10px 12px; display: none; }
  .building-body.open { display: block; }

  .level-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .level-field { flex: 1; }
  .level-field label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .level-field select { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 6px; color: var(--text); font-size: 13px; }
  .level-field select:focus { outline: none; border-color: var(--accent); }
  .arrow { color: var(--text3); font-size: 16px; padding-bottom: 6px; }

  .btn { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; font-size: 16px; font-weight: 700; border: none; border-radius: 10px; cursor: pointer; margin-top: 12px; }
  .btn:active { opacity: .85; }

  /* Results */
  .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .summary-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 12px; text-align: center; }
  .summary-card .val { font-size: 22px; font-weight: 700; }
  .summary-card .lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .fc-val { color: var(--accent); }
  .rfc-val { color: var(--rfc-color); }
  .time-val { color: var(--blue); }
  .days-val { color: var(--green); }

  .resource-section { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .resource-section .title { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 600; }
  .resource-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .resource-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .resource-item .r-icon { font-size: 15px; }
  .resource-item .r-val { font-weight: 600; }
  .resource-item .r-lbl { font-size: 11px; color: var(--text2); }

  .bottleneck { border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .bottleneck.fc { background: rgba(232,131,42,.15); border: 1px solid rgba(232,131,42,.3); }
  .bottleneck.rfc { background: rgba(167,139,250,.15); border: 1px solid rgba(167,139,250,.3); }
  .bottleneck.ok { background: rgba(61,214,140,.1); border: 1px solid rgba(61,214,140,.3); color: var(--green); }

  .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .detail-table th { background: var(--bg3); padding: 6px 8px; text-align: left; color: var(--text2); font-weight: 600; }
  .detail-table td { padding: 6px 8px; border-top: 1px solid var(--border); }
  .detail-table tr:hover td { background: rgba(255,255,255,.02); }
  .tag { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 4px; margin-left: 4px; }
  .tag.est { background: rgba(240,192,64,.15); color: var(--yellow); }

  .prereq-section { margin-top: 0; }
  .prereq-item { padding: 6px 0; border-top: 1px solid var(--border); font-size: 12px; }
  .prereq-item:first-child { border-top: none; }
  .prereq-fc { color: var(--accent); font-weight: 600; margin-bottom: 2px; }
  .prereq-list { color: var(--text2); padding-left: 12px; }
  .prereq-list li { list-style: none; padding-left: 10px; position: relative; }
  .prereq-list li::before { content: '▸'; position: absolute; left: 0; color: var(--text3); }

  .effect-card { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; }
  .effect-level { padding: 8px 12px; font-weight: 600; font-size: 13px; background: var(--bg3); display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 700; }
  .badge.fc1-3 { background: rgba(61,214,140,.2); color: var(--green); }
  .badge.fc4-5 { background: rgba(74,158,255,.2); color: var(--blue); }
  .badge.fc6-8 { background: rgba(232,131,42,.2); color: var(--accent); }
  .badge.fc9-10 { background: rgba(255,85,85,.2); color: var(--red); }
  .effect-list { padding: 8px 12px; font-size: 12px; color: var(--text2); line-height: 1.8; }
  .effect-list li { list-style: none; padding-left: 12px; position: relative; }
  .effect-list li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); }

  .empty-state { text-align: center; color: var(--text3); padding: 40px 20px; font-size: 13px; }
  .progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }

  .note { font-size: 11px; color: var(--text3); padding: 6px 0; }

  .buff-checks { margin-top: 8px; }
  .buff-check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; cursor: pointer; font-size: 13px; user-select: none; }
  .buff-check-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .buff-tag { margin-left: auto; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: rgba(61,214,140,.15); color: var(--green); font-weight: 700; }
  .buff-result { font-size: 11px; color: var(--text3); margin-top: 6px; padding: 5px 8px; background: rgba(61,214,140,.06); border-radius: 6px; }
</style>
</head>
<body>

<header>
  <h1>🔥 火晶計算ツール</h1>
  <p>ホワイトアウトサバイバル — 大溶鉱炉FC計算</p>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('input')">設定</div>
  <div class="tab" onclick="switchTab('result')">結果</div>
  <div class="tab" onclick="switchTab('effects')">効果</div>
</div>

<div id="tab-input" class="page active">

  <div class="section" style="margin-top:12px">
    <div class="section-header" onclick="toggleSection(this)">
      ⚗️ 日次生産量
      <span class="toggle">▾</span>
    </div>
    <div class="section-body">
      <div class="production-row">
        <div class="production-field">
          <label>火晶 / 日</label>
          <input type="number" id="fc-per-day" value="17" min="1" oninput="saveInputs()">
        </div>
        <div class="production-field">
          <label>精製火晶 / 日</label>
          <input type="number" id="rfc-per-day" value="7" min="1" oninput="saveInputs()">
        </div>
      </div>
      <p class="note">目安：デイリータスク10 + 水晶研究所7 = 17 FC/日</p>
    </div>
  </div>

  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      ⏱️ 建設時間バフ
      <span class="toggle">▾</span>
    </div>
    <div class="section-body">
      <div class="production-row">
        <div class="production-field">
          <label>基礎ステータス (%)</label>
          <input type="number" id="buff-base" value="0" min="0" max="100" step="0.1" oninput="saveInputs()">
        </div>
        <div class="production-field">
          <label>ペットスキル (%)</label>
          <input type="number" id="buff-pet" value="0" min="0" max="100" step="0.1" oninput="saveInputs()">
        </div>
      </div>
      <div class="buff-checks">
        <label class="buff-check-row">
          <input type="checkbox" id="buff-viceregent" onchange="saveInputs()">
          <span>副執政官</span>
          <span class="buff-tag">+10%</span>
        </label>
        <label class="buff-check-row">
          <input type="checkbox" id="buff-lords-order" onchange="saveInputs()">
          <span>領主指令 建造加速</span>
          <span class="buff-tag">+20%</span>
        </label>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header" onclick="toggleSection(this)">
      🏛️ 建物レベル設定
      <span class="toggle">▾</span>
    </div>
    <div class="section-body" id="buildings-container"></div>
  </div>

  <button class="btn" onclick="calculate()">計算する →</button>

</div>

<div id="tab-result" class="page">
  <div id="result-content"><div class="empty-state">「設定」タブで入力後、計算してください</div></div>
</div>

<div id="tab-effects" class="page">
  <div id="effects-content"><div class="empty-state">「設定」タブで入力後、計算してください</div></div>
</div>

<script>
// ============================================================
// DATA
// ============================================================

const BUILDINGS = [
  { id: 'furnace',   name: '大溶鉱炉',   icon: '🔥', color: '#e8832a' },
  { id: 'embassy',   name: '大使館',     icon: '🏛️', color: '#4a9eff' },
  { id: 'infantry',  name: '歩兵の陣',   icon: '⚔️', color: '#3dd68c' },
  { id: 'lancer',    name: '騎兵の陣',   icon: '🗡️', color: '#a78bfa' },
  { id: 'marksman',  name: '射手の陣',   icon: '🏹', color: '#f0c040' },
  { id: 'command',   name: '司令部',     icon: '🎯', color: '#ff7070' },
  { id: 'infirmary', name: '軍医所',     icon: '🏥', color: '#60d0d0' },
];

// Per-stage data: index 0 = FCレベル1帯 (Lv30→FC1), index 9 = FC9→FC10
// sub: per sub-stage (stages 1-4), comp: completion stage (stage 5)
// meat/wood/coal/iron in millions (M), same for all 5 stages of a level
// days: build days per stage (same for all 5)
// prereq: required buildings/conditions to enter this level's stages
const STAGE_DATA = {

    // FC0 → FC1
    { sub:{fc:132,rfc:0}, comp:{fc:132,rfc:0}, meat:67, wood:67, coal:13, iron:3.3, days:7, prereq:['大使館 Lv30','研究所 Lv30'] },
    // FC1 → FC2
    { sub:{fc:158,rfc:0}, comp:{fc:158,rfc:0}, meat:72, wood:72, coal:14, iron:3.6, days:9, prereq:['大使館 FC1','騎兵の陣 FC1'] },
    // FC2 → FC3
    { sub:{fc:238,rfc:0}, comp:{fc:238,rfc:0}, meat:79, wood:79, coal:15, iron:3.9, days:11, prereq:['大使館 FC2','歩兵の陣 FC2'] },
    // FC3 → FC4
    { sub:{fc:280,rfc:0}, comp:{fc:280,rfc:0}, meat:82, wood:82, coal:16, iron:4.1, days:12, prereq:['大使館 FC3','射手の陣 FC3'] },
    // FC4 → FC5
    { sub:{fc:335,rfc:0}, comp:{fc:335,rfc:0}, meat:84, wood:84, coal:16, iron:4.2, days:14, prereq:['大使館 FC4','騎兵の陣 FC4'] },
    // FC5 → FC6  (sub≠comp)
    { sub:{fc:200,rfc:10}, comp:{fc:100,rfc:20}, meat:96, wood:96, coal:19, iron:4.8, days:15, prereq:['大使館 FC5','歩兵の陣 FC5'] },
    // FC6 → FC7
    { sub:{fc:240,rfc:15}, comp:{fc:120,rfc:30}, meat:100, wood:100, coal:21, iron:5.4, days:18, prereq:['大使館 FC6','射手の陣 FC6'] },
    // FC7 → FC8
    { sub:{fc:240,rfc:20}, comp:{fc:120,rfc:40}, meat:130, wood:130, coal:26, iron:6.6, days:20, prereq:['大使館 FC7','騎兵の陣 FC7'] },
    // FC8 → FC9
    { sub:{fc:280,rfc:30}, comp:{fc:140,rfc:60}, meat:140, wood:140, coal:29, iron:7.2, days:13, prereq:['大使館 FC8','歩兵の陣 FC8'] },
    // FC9 → FC10  (comp estimated from total)
    { sub:{fc:350,rfc:70}, comp:{fc:175,rfc:140,est:true}, meat:160, wood:160, coal:33, iron:8.4, days:20, prereq:['大使館 FC9','射手の陣 FC9'] },
  ],

  // Infantry / Lancer / Marksman share identical FC costs and resource costs
  infantry: [
    { sub:{fc:59,rfc:0},   comp:{fc:59,rfc:0},   meat:23, wood:23, coal:4.7, iron:1.1, days:1.05, prereq:['大溶鉱炉 FC1'] },
    { sub:{fc:71,rfc:0},   comp:{fc:71,rfc:0},   meat:25, wood:25, coal:5.0, iron:1.2, days:1.35, prereq:['大溶鉱炉 FC2'] },
    { sub:{fc:107,rfc:0},  comp:{fc:107,rfc:0},  meat:27, wood:27, coal:5.5, iron:1.3, days:1.65, prereq:['大溶鉱炉 FC3'] },
    { sub:{fc:126,rfc:0},  comp:{fc:126,rfc:0},  meat:28, wood:28, coal:5.7, iron:1.4, days:1.8,  prereq:['大溶鉱炉 FC4'] },
    { sub:{fc:150,rfc:0},  comp:{fc:150,rfc:0},  meat:29, wood:29, coal:5.9, iron:1.4, days:2.1,  prereq:['大溶鉱炉 FC5'] },
    { sub:{fc:90,rfc:4},   comp:{fc:45,rfc:9},   meat:33, wood:33, coal:6.7, iron:1.6, days:2.25, prereq:['大溶鉱炉 FC6'] },
    { sub:{fc:108,rfc:6},  comp:{fc:54,rfc:13},  meat:38, wood:38, coal:7.6, iron:1.9, days:2.7,  prereq:['大溶鉱炉 FC7'] },
    { sub:{fc:108,rfc:9},  comp:{fc:54,rfc:19},  meat:46, wood:46, coal:9.3, iron:2.3, days:3.0,  prereq:['大溶鉱炉 FC8'] },
    { sub:{fc:126,rfc:13}, comp:{fc:63,rfc:27},  meat:50, wood:50, coal:10,  iron:2.5, days:1.95, prereq:['大溶鉱炉 FC9'] },
    { sub:{fc:157,rfc:31}, comp:{fc:78,rfc:63},  meat:59, wood:59, coal:11,  iron:2.9, days:3.0,  prereq:['大溶鉱炉 FC10'] },
  ],
};
STAGE_DATA.lancer   = STAGE_DATA.infantry;
STAGE_DATA.marksman = STAGE_DATA.infantry;

// Fallback totals for buildings without per-stage resource data
// (embassy, command, infirmary) — used only when STAGE_DATA not available
const COSTS = {
  embassy: [
    {fc:165,rfc:0},  {fc:195,rfc:0},  {fc:295,rfc:0},  {fc:350,rfc:0},  {fc:415,rfc:0},
    {fc:225,rfc:13}, {fc:270,rfc:19}, {fc:270,rfc:31},  {fc:315,rfc:42}, {fc:392,rfc:103},
  ],
  command: [
    {fc:130,rfc:0},  {fc:155,rfc:0},  {fc:235,rfc:0},  {fc:280,rfc:0},  {fc:335,rfc:0},
    {fc:180,rfc:10,est:true}, {fc:216,rfc:15,est:true}, {fc:216,rfc:25,est:true},
    {fc:252,rfc:34,est:true}, {fc:314,rfc:82,est:true},
  ],
  infirmary: [
    {fc:130,rfc:0},  {fc:155,rfc:0},  {fc:235,rfc:0},  {fc:280,rfc:0},  {fc:335,rfc:0},
    {fc:180,rfc:10,est:true}, {fc:216,rfc:15,est:true}, {fc:216,rfc:25,est:true},
    {fc:252,rfc:34,est:true}, {fc:314,rfc:82,est:true},
  ],
};

// Fallback build days (furnace reference, before screenshot correction)
const BUILD_DAYS_PER_STAGE = [7, 9, 11, 12, 14, 15, 18, 20, 13, 20];

// Server day unlock per FC level
const SERVER_DAY_UNLOCK = [60,60,60,150,150,315,315,315,500,500];

const EFFECTS = {
  furnace: {
    1: ['熱量・都市戦力が上昇', '大使館・軍医所・兵種キャンプのFCアップグレード解放'],
    3: ['水晶スキル Tier1 解放（各兵種陣がFC3以上で有効化）'],
    4: ['水晶研究所 アンロック（サーバーDay150）'],
    5: ['水晶スキル Tier2 解放 / 精製火晶の使用開始'],
    6: ['全アップグレードで精製火晶が必須に（サーバーDay315）'],
    8: ['水晶スキル Tier3 解放'],
    10: ['水晶スキル Tier4 解放（最高位） / フロストスター経済開始'],
  },
  infantry: {
    3: ['水晶の盾 I：25%の確率で36ダメージを無効化'],
    5: ['水晶の盾 II：37.5%の確率で36ダメージを無効化'],
    8: ['光の体 I：歩兵防御+4%、水晶の盾発動時ダメ軽減+10%'],
    10: ['光の体 II：歩兵防御+6%、水晶の盾発動時ダメ軽減+15%'],
  },
  lancer: {
    3: ['水晶の槍 I：10%の確率でダメージ2倍'],
    5: ['水晶の槍 II：15%の確率でダメージ2倍'],
    8: ['白熱フィールド I：攻撃を受けた時10%の確率で被ダメ半減'],
    10: ['白熱フィールド II：攻撃を受けた時15%の確率で被ダメ半減'],
  },
  marksman: {
    3: ['水晶の火薬 I：20%の確率でダメージ+50%'],
    5: ['水晶の火薬 II：30%の確率でダメージ+50%'],
    8: ['炎の装填 I：射手基礎攻撃+4%、水晶の火薬発動時ダメージ+25%'],
    10: ['炎の装填 II：射手基礎攻撃+6%、水晶の火薬発動時ダメージ+37.5%'],
  },
  embassy:   { 1: ['援軍容量が上昇'], 5: ['援軍容量がさらに上昇'], 10: ['援軍容量 最大値'] },
  command:   { 1: ['行軍容量・集会容量が上昇'], 5: ['行軍容量・集会容量がさらに上昇'], 10: ['行軍容量・集会容量 最大値'] },
  infirmary: { 1: ['病床容量が上昇'], 5: ['病床容量がさらに上昇'], 10: ['病床容量 最大値'] },
};

const SUBSTAGES = 5;

// ============================================================
// HELPERS
// ============================================================

function levelToIndex(fc, sub) {
  return fc + sub / SUBSTAGES;
}

function parseLevel(val) {
  const [fc, sub] = val.split('-').map(Number);
  return { fc, sub };
}

function fmtDays(days) {
  const d = Math.floor(days);
  const h = Math.round((days - d) * 24);
  if (h === 0) return `${d}日`;
  return `${d}日 ${h}h`;
}

function fmtRes(valM) {
  // valM is in millions
  if (valM >= 1000) return (valM / 1000).toFixed(2) + 'B';
  return valM.toFixed(1) + 'M';
}

// ============================================================
// CALCULATION CORE
// ============================================================

// stageRange: iterate stages startSub..endSub within one FC level
// Returns {fc, rfc, meat, wood, coal, iron, days, est}
function _sumStages(d, startSub, endSub) {
  let fc=0, rfc=0, meat=0, wood=0, coal=0, iron=0, days=0, est=false;
  for (let s = startSub; s <= endSub; s++) {
    const isComp = s === 5;
    const slot = isComp ? d.comp : d.sub;
    fc   += slot.fc;
    rfc  += slot.rfc;
    if (slot.est) est = true;
    meat  += d.meat  || 0;
    wood  += d.wood  || 0;
    coal  += d.coal  || 0;
    iron  += d.iron  || 0;
    days  += d.days  || 0;
  }
  return {fc, rfc, meat, wood, coal, iron, days, est};
}

function _stageRange(fromFc, fromSub, toFc, fc) {
  // Returns [startSub, endSub] for fc level given from/to bounds
  let startSub = 1, endSub = SUBSTAGES;
  if (fc === fromFc) startSub = fromSub + 1;
  if (fc === toFc)   endSub   = 0; // handled by caller
  return [startSub, endSub];
}

function calcCost(buildingId, fromFc, fromSub, toFc, toSub) {
  if (levelToIndex(fromFc, fromSub) >= levelToIndex(toFc, toSub)) {
    return {fc:0, rfc:0, meat:0, wood:0, coal:0, iron:0, days:0, est:false};
  }

  const sd = STAGE_DATA[buildingId];

  // --- Buildings with per-stage data ---
  if (sd) {
    let total = {fc:0, rfc:0, meat:0, wood:0, coal:0, iron:0, days:0, est:false};
    for (let fc = 1; fc <= 10; fc++) {
      if (fc < fromFc || fc > toFc) continue;
      const d = sd[fc - 1];
      if (!d) continue;

      let startSub = (fc === fromFc || (fromFc === 0 && fc === 1)) ? fromSub + 1 : 1;
      let endSub   = (fc === toFc)   ? (toSub === 0 ? SUBSTAGES : toSub) : SUBSTAGES;

      if (startSub > endSub) continue;

      const chunk = _sumStages(d, startSub, endSub);
      total.fc   += chunk.fc;
      total.rfc  += chunk.rfc;
      total.meat += chunk.meat;
      total.wood += chunk.wood;
      total.coal += chunk.coal;
      total.iron += chunk.iron;
      total.days += chunk.days;
      if (chunk.est) total.est = true;
    }
    return total;
  }

  // --- Fallback: even split from COSTS ---
  const costs = COSTS[buildingId];
  if (!costs) return {fc:0, rfc:0, meat:0, wood:0, coal:0, iron:0, days:0, est:false};

  let totalFc = 0, totalRfc = 0, hasEst = false;
  for (let fc = 1; fc <= 10; fc++) {
    if (fc < fromFc || fc > toFc) continue;
    const c = costs[fc - 1];
    if (!c) continue;
    if (c.est) hasEst = true;

    const fcPerStage  = c.fc  / SUBSTAGES;
    const rfcPerStage = c.rfc / SUBSTAGES;

    let startSub = (fc === fromFc) ? fromSub + 1 : 1;
    let endSub   = (fc === toFc)   ? (toSub === 0 ? SUBSTAGES : toSub) : SUBSTAGES;

    if (fc === fromFc && fc === toFc) {
      const stages = (toSub === 0 ? SUBSTAGES : toSub) - fromSub;
      if (stages <= 0) continue;
      totalFc  += fcPerStage  * stages;
      totalRfc += rfcPerStage * stages;
      continue;
    }

    const stages = endSub - startSub + 1;
    if (stages > 0) {
      totalFc  += fcPerStage  * stages;
      totalRfc += rfcPerStage * stages;
    }
  }
  return {fc: Math.round(totalFc), rfc: Math.round(totalRfc), meat:0, wood:0, coal:0, iron:0, days:0, est: hasEst};
}

function calcBuildDays(buildingId, fromFc, fromSub, toFc, toSub) {
  if (levelToIndex(fromFc, fromSub) >= levelToIndex(toFc, toSub)) return 0;
  const sd = STAGE_DATA[buildingId];
  let days = 0;
  for (let fc = 1; fc <= 10; fc++) {
    if (fc < fromFc || fc > toFc) continue;
    const dps = sd && sd[fc-1] ? sd[fc-1].days : BUILD_DAYS_PER_STAGE[fc-1];
    let startSub = (fc === fromFc || (fromFc === 0 && fc === 1)) ? fromSub + 1 : 1;
    let endSub   = (fc === toFc)   ? (toSub === 0 ? SUBSTAGES : toSub) : SUBSTAGES;
    if (fc === fromFc && fc === toFc) {
      days += dps * Math.max(0, (toSub === 0 ? SUBSTAGES : toSub) - fromSub);
      continue;
    }
    const stages = endSub - startSub + 1;
    if (stages > 0) days += dps * stages;
  }
  return days;
}

// ============================================================
// UI INIT
// ============================================================

function buildLevelOptions(includeZero = true) {
  let opts = '';
  if (includeZero) {
    opts += '<option value="0-0">Lv.30（FC前）</option>';
    for (let s = 1; s < SUBSTAGES; s++) {
      opts += `<option value="0-${s}">FC0 — ${s}段目</option>`;
    }
  }
  for (let fc = 1; fc <= 10; fc++) {
    opts += `<option value="${fc}-0">FC${fc}</option>`;
    for (let s = 1; s <= SUBSTAGES; s++) {
      opts += `<option value="${fc}-${s}">FC${fc} — ${s}段目</option>`;
    }
  }
  return opts;
}

function initBuildings() {
  const container = document.getElementById('buildings-container');
  container.innerHTML = BUILDINGS.map(b => `
    <div class="building-card" id="card-${b.id}">
      <div class="building-header" onclick="toggleBuilding('${b.id}')">
        <div class="building-icon" style="background:${b.color}22">${b.icon}</div>
        <div>
          <div class="building-name">${b.name}</div>
          <div class="building-sub" id="sub-${b.id}">FC0 → FC0</div>
        </div>
        <div class="building-toggle" onclick="event.stopPropagation()">
          <input type="checkbox" id="chk-${b.id}" checked onchange="toggleCheck('${b.id}'); saveInputs()">
        </div>
      </div>
      <div class="building-body" id="body-${b.id}">
        <div class="level-row">
          <div class="level-field">
            <label>現在</label>
            <select id="from-${b.id}" onchange="updateSub('${b.id}'); saveInputs()">
              ${buildLevelOptions(true)}
            </select>
          </div>
          <div class="arrow">→</div>
          <div class="level-field">
            <label>目標</label>
            <select id="to-${b.id}" onchange="updateSub('${b.id}'); saveInputs()">
              ${buildLevelOptions(false)}
            </select>
          </div>
        </div>
      </div>
    </div>
  `).join('');

  BUILDINGS.forEach(b => {
    document.getElementById(`to-${b.id}`).value = '5-0';
    updateSub(b.id);
    if (b.id === 'furnace') toggleBuilding('furnace');
  });
  loadInputs();
}

function toggleBuilding(id) {
  document.getElementById(`body-${id}`).classList.toggle('open');
}

function toggleCheck(id) {
  const checked = document.getElementById(`chk-${id}`).checked;
  document.getElementById(`card-${id}`).style.opacity = checked ? '1' : '0.4';
}

function updateSub(id) {
  const from = document.getElementById(`from-${id}`).value;
  const to   = document.getElementById(`to-${id}`).value;
  const [fc1, s1] = from.split('-').map(Number);
  const [fc2, s2] = to.split('-').map(Number);
  const fromLabel = fc1 === 0 ? (s1 === 0 ? 'FC前' : `FC0-${s1}段`) : (s1 === 0 ? `FC${fc1}` : `FC${fc1}-${s1}段`);
  const toLabel   = s2 === 0 ? `FC${fc2}` : `FC${fc2}-${s2}段`;
  document.getElementById(`sub-${id}`).textContent = `${fromLabel} → ${toLabel}`;
}

function saveInputs() {
  try {
    const d = {};
    ['fc-per-day','rfc-per-day','buff-base','buff-pet'].forEach(id => {
      const el = document.getElementById(id); if (el) d[id] = el.value;
    });
    ['buff-viceregent','buff-lords-order'].forEach(id => {
      const el = document.getElementById(id); if (el) d[id] = el.checked;
    });
    BUILDINGS.forEach(b => {
      const f = document.getElementById(`from-${b.id}`);
      const t = document.getElementById(`to-${b.id}`);
      const c = document.getElementById(`chk-${b.id}`);
      if (f) d[`from-${b.id}`] = f.value;
      if (t) d[`to-${b.id}`]   = t.value;
      if (c) d[`chk-${b.id}`]  = c.checked;
    });
    localStorage.setItem('fc-calc', JSON.stringify(d));
  } catch(e) {}
}

function loadInputs() {
  try {
    const d = JSON.parse(localStorage.getItem('fc-calc') || '{}');
    ['fc-per-day','rfc-per-day','buff-base','buff-pet'].forEach(id => {
      if (d[id] != null) { const el = document.getElementById(id); if (el) el.value = d[id]; }
    });
    ['buff-viceregent','buff-lords-order'].forEach(id => {
      if (d[id] != null) { const el = document.getElementById(id); if (el) el.checked = d[id]; }
    });
    BUILDINGS.forEach(b => {
      if (d[`from-${b.id}`] != null) { const el = document.getElementById(`from-${b.id}`); if (el) el.value = d[`from-${b.id}`]; }
      if (d[`to-${b.id}`]   != null) { const el = document.getElementById(`to-${b.id}`);   if (el) el.value = d[`to-${b.id}`]; }
      if (d[`chk-${b.id}`]  != null) {
        const el = document.getElementById(`chk-${b.id}`);
        if (el) { el.checked = d[`chk-${b.id}`]; toggleCheck(b.id); }
      }
      updateSub(b.id);
    });
  } catch(e) {}
}

function toggleSection(el) {
  el.classList.toggle('collapsed');
  el.nextElementSibling.style.display = el.classList.contains('collapsed') ? 'none' : '';
}

// ============================================================
// MAIN CALCULATION
// ============================================================

function calculate() {
  const fcPerDay  = parseFloat(document.getElementById('fc-per-day').value)  || 17;
  const rfcPerDay = parseFloat(document.getElementById('rfc-per-day').value) || 7;

  const buffBase     = parseFloat(document.getElementById('buff-base')?.value)    || 0;
  const buffPet      = parseFloat(document.getElementById('buff-pet')?.value)     || 0;
  const buffVice     = document.getElementById('buff-viceregent')?.checked ? 10 : 0;
  const buffLords    = document.getElementById('buff-lords-order')?.checked ? 20 : 0;
  const buffAccel    = buffLords;                          // 建造加速：(1-accel)
  const buffSpeed    = buffBase + buffPet + buffVice;      // 基礎+ペット+副執政官：÷(1+speed)
  const hasBuffs     = buffAccel > 0 || buffSpeed > 0;
  const applyBuff    = d => d * (1 - buffAccel / 100) / (1 + buffSpeed / 100);

  let rows = [];
  let totalFc=0, totalRfc=0, furnaceDays=0;
  let totalMeat=0, totalWood=0, totalCoal=0, totalIron=0;
  let hasEst = false;
  let prereqsByFc = {}; // fc → [{building, list}]
  let effectsToShow = {};

  BUILDINGS.forEach(b => {
    if (!document.getElementById(`chk-${b.id}`).checked) return;

    const from = parseLevel(document.getElementById(`from-${b.id}`).value);
    const to   = parseLevel(document.getElementById(`to-${b.id}`).value);
    if (levelToIndex(from.fc, from.sub) >= levelToIndex(to.fc, to.sub)) return;

    const cost = calcCost(b.id, from.fc, from.sub, to.fc, to.sub);
    const days = calcBuildDays(b.id, from.fc, from.sub, to.fc, to.sub);
    if (cost.est) hasEst = true;

    totalFc   += cost.fc;
    totalRfc  += cost.rfc;
    totalMeat += cost.meat;
    totalWood += cost.wood;
    totalCoal += cost.coal;
    totalIron += cost.iron;
    if (b.id === 'furnace') furnaceDays = days;

    rows.push({ b, from, to, cost, days });

    // Collect prerequisites per FC level
    const sd = STAGE_DATA[b.id];
    if (sd) {
      for (let fc = Math.max(1, from.fc); fc <= to.fc; fc++) {
        if (!sd[fc-1]) continue;
        const entryFc = fc;
        // Only include if this fc level is actually traversed
        let startSub = (fc === from.fc) ? from.sub + 1 : 1;
        let endSub   = (fc === to.fc)   ? (to.sub === 0 ? SUBSTAGES : to.sub) : SUBSTAGES;
        if (startSub > endSub) continue;
        if (!prereqsByFc[entryFc]) prereqsByFc[entryFc] = [];
        const prereqs = sd[fc-1].prereq || [];
        if (prereqs.length) prereqsByFc[entryFc].push({ b, prereqs });
      }
    }

    // Collect effects
    const bEffects = EFFECTS[b.id] || {};
    for (let fc = from.fc + 1; fc <= to.fc; fc++) {
      if (bEffects[fc]) {
        if (!effectsToShow[fc]) effectsToShow[fc] = [];
        effectsToShow[fc].push({ b, effects: bEffects[fc] });
      }
    }
  });

  if (rows.length === 0) {
    document.getElementById('result-content').innerHTML =
      '<div class="empty-state">対象の建物がないか、既に目標レベルに達しています</div>';
    switchTab('result');
    return;
  }

  const fcDays  = totalFc  / fcPerDay;
  const rfcDays = totalRfc > 0 ? totalRfc / rfcPerDay : 0;
  const bottleneckDays = Math.max(fcDays, rfcDays);
  const bottleneck = rfcDays > fcDays ? 'rfc' : 'fc';

  const completionDays = Math.ceil(bottleneckDays);
  const completionDate = new Date();
  completionDate.setDate(completionDate.getDate() + completionDays);
  const completionStr = `${completionDate.getMonth()+1}/${completionDate.getDate()}`;
  const completionFull = `${completionDate.getFullYear()}年${completionDate.getMonth()+1}月${completionDate.getDate()}日`;

  // ---- Summary cards ----
  let html = `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="val fc-val">${totalFc.toLocaleString()}</div>
        <div class="lbl">必要 火晶</div>
        <div class="progress-bar"><div class="progress-fill" style="width:100%;background:var(--accent)"></div></div>
      </div>
      <div class="summary-card">
        <div class="val rfc-val">${totalRfc.toLocaleString()}</div>
        <div class="lbl">必要 精製火晶</div>
        <div class="progress-bar"><div class="progress-fill" style="width:100%;background:var(--rfc-color)"></div></div>
      </div>
      <div class="summary-card">
        <div class="val time-val">${fmtDays(furnaceDays)}</div>
        <div class="lbl">大溶鉱炉 建設時間計</div>
        ${hasBuffs ? `<div class="lbl" style="color:var(--green);margin-top:5px">▶ ${fmtDays(applyBuff(furnaceDays))}<span style="font-size:10px;margin-left:3px">バフ後</span></div>` : ''}
      </div>
      <div class="summary-card">
        <div class="val days-val">${completionStr}</div>
        <div class="lbl">完了予定日（${completionDays}日後）</div>
      </div>
    </div>
  `;

  // ---- Resource totals ----
  if (totalMeat > 0 || totalWood > 0) {
    html += `
      <div class="resource-section">
        <div class="title">一般資材 合計（建物合算）</div>
        <div class="resource-grid">
          <div class="resource-item"><span class="r-icon">🥩</span><span class="r-val">${fmtRes(totalMeat)}</span><span class="r-lbl">肉</span></div>
          <div class="resource-item"><span class="r-icon">🪵</span><span class="r-val">${fmtRes(totalWood)}</span><span class="r-lbl">木材</span></div>
          <div class="resource-item"><span class="r-icon">🪨</span><span class="r-val">${fmtRes(totalCoal)}</span><span class="r-lbl">石炭</span></div>
          <div class="resource-item"><span class="r-icon">🔩</span><span class="r-val">${fmtRes(totalIron)}</span><span class="r-lbl">鉄</span></div>
        </div>
      </div>
    `;
  }

  // ---- Bottleneck ----
  if (bottleneck === 'rfc' && totalRfc > 0) {
    html += `<div class="bottleneck rfc">⚗️ ボトルネック：精製火晶（${Math.ceil(rfcDays)}日）が火晶（${Math.ceil(fcDays)}日）より長くかかります</div>`;
  } else if (totalRfc > 0) {
    html += `<div class="bottleneck fc">🔥 ボトルネック：火晶（${Math.ceil(fcDays)}日）が精製火晶（${Math.ceil(rfcDays)}日）より長くかかります</div>`;
  } else {
    html += `<div class="bottleneck ok">✅ 精製火晶は不要です（FC5以下のアップグレード）</div>`;
  }

  // ---- Per-building detail table ----
  html += `<div class="section"><div class="section-header" onclick="toggleSection(this)">📊 建物別内訳 <span class="toggle">▾</span></div><div class="section-body" style="padding:0;overflow-x:auto">
    <table class="detail-table">
      <thead><tr><th>建物</th><th>範囲</th><th>火晶</th><th>精製火晶</th><th>建造時間</th></tr></thead>
      <tbody>
  `;
  rows.forEach(r => {
    const fromLabel = r.from.fc === 0 ? 'FC前' : (r.from.sub === 0 ? `FC${r.from.fc}` : `FC${r.from.fc}-${r.from.sub}`);
    const toLabel   = r.to.sub === 0 ? `FC${r.to.fc}` : `FC${r.to.fc}-${r.to.sub}`;
    const rawDays   = r.days > 0 ? fmtDays(r.days) : '—';
    const buffStr   = (hasBuffs && r.days > 0) ? `<span style="color:var(--green);font-size:11px"> → ${fmtDays(applyBuff(r.days))}</span>` : '';
    const daysStr   = rawDays + buffStr;
    html += `<tr>
      <td>${r.b.icon} ${r.b.name}${r.cost.est ? '<span class="tag est">推定</span>' : ''}</td>
      <td style="color:var(--text2)">${fromLabel}→${toLabel}</td>
      <td style="color:var(--accent)">${r.cost.fc.toLocaleString()}</td>
      <td style="color:var(--rfc-color)">${r.cost.rfc.toLocaleString()}</td>
      <td style="color:var(--blue)">${daysStr}</td>
    </tr>`;
    // Sub-row for resources if available
    if (r.cost.meat > 0) {
      html += `<tr style="background:rgba(255,255,255,.01)">
        <td colspan="5" style="color:var(--text3);font-size:11px;padding:3px 8px 6px 24px">
          🥩 ${fmtRes(r.cost.meat)} / 🪵 ${fmtRes(r.cost.wood)} / 🪨 ${fmtRes(r.cost.coal)} / 🔩 ${fmtRes(r.cost.iron)}
        </td>
      </tr>`;
    }
  });
  html += '</tbody></table></div></div>';

  if (hasBuffs) {
    const accelParts = [], speedParts = [];
    if (buffLords > 0) accelParts.push(`領主指令 20%`);
    if (buffBase  > 0) speedParts.push(`基礎 ${buffBase}%`);
    if (buffPet   > 0) speedParts.push(`ペット ${buffPet}%`);
    if (buffVice  > 0) speedParts.push(`副執政官 10%`);
    const accelStr = accelParts.length ? accelParts.join('+') : '0%';
    const speedStr = speedParts.length ? speedParts.join('+') : '0%';
    html += `<div class="buff-result">⏱️ 計算式：必要日数 × (1 − ${buffAccel}%) ÷ (1 + ${buffSpeed}%) &emsp; 建造加速：${accelStr} &emsp; 短縮：${speedStr}</div>`;
  }
  if (hasEst) html += '<p class="note" style="padding:0 4px">※ 推定値：司令部・軍医所のFC6以降、および溶鉱炉FC10完成段は推定値です</p>';

  // ---- Prerequisites section ----
  const prereqFcLevels = Object.keys(prereqsByFc).map(Number).sort((a,b) => a-b);
  if (prereqFcLevels.length > 0) {
    html += `<div class="section"><div class="section-header" onclick="toggleSection(this)">🔒 レベルアップ条件 <span class="toggle">▾</span></div><div class="section-body prereq-section">`;
    prereqFcLevels.forEach(fc => {
      const unlockDay = SERVER_DAY_UNLOCK[fc - 1];
      // Deduplicate prereq strings across buildings at this fc level
      const seen = new Set();
      const allPrereqs = [];
      prereqsByFc[fc].forEach(({ b, prereqs }) => {
        prereqs.forEach(p => {
          const key = `${b.name}: ${p}`;
          if (!seen.has(key)) { seen.add(key); allPrereqs.push({ icon: b.icon, name: b.name, text: p }); }
        });
      });
      html += `<div class="prereq-item">
        <div class="prereq-fc">FC${fc} <span style="font-weight:400;color:var(--text3);font-size:11px">（サーバーDay${unlockDay}〜）</span></div>
        <ul class="prereq-list">
          ${allPrereqs.map(p => `<li>${p.icon} ${p.name} → ${p.text}</li>`).join('')}
        </ul>
      </div>`;
    });
    html += '</div></div>';
  }

  document.getElementById('result-content').innerHTML = html;

  // ---- Effects tab ----
  let efHtml = '';
  const fcLevels = Object.keys(effectsToShow).map(Number).sort((a,b) => a-b);
  if (fcLevels.length === 0) {
    efHtml = '<div class="empty-state">このアップグレード範囲では効果の解放はありません</div>';
  } else {
    fcLevels.forEach(fc => {
      const badgeClass = fc <= 3 ? 'fc1-3' : fc <= 5 ? 'fc4-5' : fc <= 8 ? 'fc6-8' : 'fc9-10';
      const unlockDay  = SERVER_DAY_UNLOCK[fc - 1];
      efHtml += `<div class="effect-card">
        <div class="effect-level">
          <span class="badge ${badgeClass}">FC${fc}</span>
          <span style="font-weight:400;color:var(--text2);font-size:11px">サーバーDay${unlockDay}〜</span>
        </div>`;
      effectsToShow[fc].forEach(item => {
        efHtml += `<div class="effect-list">${item.b.icon} <strong>${item.b.name}</strong>
          <ul>${item.effects.map(e => `<li>${e}</li>`).join('')}</ul>
        </div>`;
      });
      efHtml += '</div>';
    });
  }
  document.getElementById('effects-content').innerHTML = efHtml;

  switchTab('result');
}

// ============================================================
// TAB SWITCHING
// ============================================================

function switchTab(id) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['input','result','effects'][i] === id);
  });
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${id}`).classList.add('active');
}

initBuildings();
</script>
