<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WOS ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#0d1b2a;color:#e2e8f0;font-family:'Hiragino Sans','Noto Sans JP',sans-serif;max-width:480px;margin:0 auto;min-height:100dvh;}
.hdr{background:linear-gradient(180deg,#1a3a5c,#0d2238);padding:20px 16px 16px;border-bottom:2px solid #1e4d7a;text-align:center;}
.hdr h1{font-size:18px;font-weight:700;color:#93c5fd;}
.hdr p{font-size:11px;color:#64748b;margin-top:4px;}
.list{padding:14px;display:flex;flex-direction:column;gap:10px;}
a.card{display:flex;align-items:center;gap:12px;background:#112233;border:1px solid #1e3a5c;border-radius:12px;padding:14px;text-decoration:none;color:inherit;}
a.card:active{background:#16304d;}
.icon{font-size:26px;flex-shrink:0;width:36px;text-align:center;}
.txt{flex:1;min-width:0;}
.name{font-size:14px;font-weight:700;color:#e2e8f0;}
.desc{font-size:11px;color:#64748b;margin-top:2px;}
.arr{font-size:14px;color:#334155;flex-shrink:0;}
.ftr{padding:16px;text-align:center;font-size:10px;color:#334155;}
</style>
</head>
<body>

<div class="hdr">
  <h1>❄️ WOS ツール</h1>
  <p>Whiteout Survival 攻略ツール集</p>
</div>

<div class="list">
  <a class="card" href="index.html">
    <div class="icon">⚔️</div>
    <div class="txt">
      <div class="name">領主装備・宝石計算ツール</div>
      <div class="desc">装備強化・宝石LvUPの必要素材とバフを計算</div>
    </div>
    <div class="arr">›</div>
  </a>
  <a class="card" href="fc-calculator.html">
    <div class="icon">🔥</div>
    <div class="txt">
      <div class="name">火晶建築資源計算ツール</div>
      <div class="desc">建物の火晶・資材必要量と建築日数を計算</div>
    </div>
    <div class="arr">›</div>
  </a>
  <a class="card" href="resource-calc.html">
    <div class="icon">🏭</div>
    <div class="txt">
      <div class="name">都市資源生産計算ツール</div>
      <div class="desc">生肉・木材・石炭・鉄鉱の生産量を計算</div>
    </div>
    <div class="arr">›</div>
  </a>
  <a class="card" href="heal-calculator.html">
    <div class="icon">🏥</div>
    <div class="txt">
      <div class="name">治療資源計算ツール</div>
      <div class="desc">負傷兵の治療に必要な資源を計算</div>
    </div>
    <div class="arr">›</div>
  </a>
</div>

<div class="ftr">summy3598j/wos</div>

</body>
</html>
